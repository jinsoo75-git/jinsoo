<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: "class" };
</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-900 dark:to-slate-950 transition-colors">

  <div class="max-w-2xl mx-auto px-4 py-8">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">TaskFlow Pro</h1>
      <button
        id="theme-toggle"
        class="w-11 h-11 min-w-[44px] min-h-[44px] rounded-xl shadow-lg bg-white/60 dark:bg-slate-800/60 backdrop-blur flex items-center justify-center text-xl"
        aria-label="테마 전환"
      >🌙</button>
    </header>

    <section class="rounded-xl shadow-lg bg-white/60 dark:bg-slate-800/60 backdrop-blur p-4 mb-6">
      <form id="task-form" class="flex flex-col gap-3">
        <input
          id="input-title"
          type="text"
          placeholder="업무 제목"
          maxlength="200"
          required
          class="rounded-xl px-4 py-3 min-h-[44px] bg-white/80 dark:bg-slate-900/60 dark:text-slate-100 shadow-inner outline-none"
        />
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            id="input-due-at"
            type="datetime-local"
            class="flex-1 rounded-xl px-4 py-3 min-h-[44px] bg-white/80 dark:bg-slate-900/60 dark:text-slate-100 shadow-inner outline-none"
          />
          <select
            id="input-status"
            class="rounded-xl px-4 py-3 min-h-[44px] bg-white/80 dark:bg-slate-900/60 dark:text-slate-100 shadow-inner outline-none"
          >
            <option value="todo">할 일</option>
            <option value="in_progress">진행 중</option>
            <option value="done">완료</option>
          </select>
        </div>
        <button
          type="submit"
          class="rounded-xl px-4 py-3 min-h-[44px] bg-blue-500 hover:bg-blue-600 text-white font-medium shadow-lg transition-colors"
        >추가</button>
      </form>
    </section>

    <section id="task-list" class="flex flex-col gap-3"></section>
  </div>

  <div
    id="edit-modal"
    class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center p-4"
  >
    <div class="w-full max-w-md rounded-xl shadow-lg bg-white/90 dark:bg-slate-800/90 backdrop-blur p-5">
      <h2 class="text-lg font-semibold mb-4 text-slate-800 dark:text-slate-100">업무 수정</h2>
      <form id="edit-form" class="flex flex-col gap-3">
        <input type="hidden" id="edit-id" />
        <input
          id="edit-title"
          type="text"
          maxlength="200"
          required
          class="rounded-xl px-4 py-3 min-h-[44px] bg-white/80 dark:bg-slate-900/60 dark:text-slate-100 shadow-inner outline-none"
        />
        <textarea
          id="edit-description"
          placeholder="설명"
          class="rounded-xl px-4 py-3 min-h-[44px] bg-white/80 dark:bg-slate-900/60 dark:text-slate-100 shadow-inner outline-none"
        ></textarea>
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            id="edit-due-at"
            type="datetime-local"
            class="flex-1 rounded-xl px-4 py-3 min-h-[44px] bg-white/80 dark:bg-slate-900/60 dark:text-slate-100 shadow-inner outline-none"
          />
          <select
            id="edit-status"
            class="rounded-xl px-4 py-3 min-h-[44px] bg-white/80 dark:bg-slate-900/60 dark:text-slate-100 shadow-inner outline-none"
          >
            <option value="todo">할 일</option>
            <option value="in_progress">진행 중</option>
            <option value="done">완료</option>
          </select>
        </div>
        <div class="flex gap-3 justify-end mt-2">
          <button
            type="button"
            id="edit-cancel"
            class="rounded-xl px-4 py-3 min-h-[44px] bg-slate-200 dark:bg-slate-700 dark:text-slate-100 shadow"
          >취소</button>
          <button
            type="submit"
            class="rounded-xl px-4 py-3 min-h-[44px] bg-blue-500 hover:bg-blue-600 text-white font-medium shadow-lg"
          >저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
